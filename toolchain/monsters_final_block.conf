# ============================================================================
# NetHack 5.0.0 monster-range repair -- 32 monsters + 1 inherited mis-binding
# ============================================================================
# Supersedes the earlier "NetHack 5.0.0 monster renames" block above, which is
# INERT and must be DELETED: vulture_redirect_tile() (vulture_tileconfig.cpp:330)
# looks the TARGET name up first --
#     dst = vulture_get_tile_index(redir_tiletype, redir_tilename, 1);
#     if (dst == -1) return;
# -- and tilenames[TT_MONSTER] is generated at startup from pmname(&mons[i],
# NEUTRAL) over 5.0.0's mons[] (vulture_tileconfig.cpp init_monnames), so
# "PM_KOBOLD_LORD" is not a slot at all in 5.0.0. Every line of the form
# "monster.PM_NEW => monster.PM_OLD" therefore compiles clean, parses clean,
# passes toolchain/rename_map.py's textual resolves(), and installs NOTHING.
# 28 of those 30 shipped lines are dead today; the leaders still draw magenta.
# The repair must REKEY IN PLACE: a direct '=' on the live 5.0.0 name, carrying
# the old line's PNG path and its per-range hotspots verbatim.
#
# ONE-HOP RULE: vulture_resolve_tile_id() (vulture_tile.cpp:140) is
#     if (... .ptr != -1) tile_id = ...ptr;
# an `if`, not a `while`. Every '=>' below therefore targets a DIRECT '='
# definition. A chained redirect lands on a filename-less slot, vulture_load_tile()
# returns NULL and the tile draws NOTHING -- the invisible-content failure the
# governing rule forbids outright.
#
# Verified independently against a resolver that models runtime semantics
# (left AND right name must be live 5.0.0 slots; exactly one hop; terminal slot
# must carry a non-empty filename): 32 monsters fail today, not 31. The extra is
# PM_HEALER, dead since its redirect targets the removed PM_PRIEST.
# All referenced PNGs were stat'd on disk in VultureNetHack/tiles.


# ---- 1. Pure renames: 5.0.0 degendered / de-archaised 12 monster titles ----
# Not missing art. 5.0.0 replaced MON(name,...) with MON(NAMS(male,female,neutral),
# ...) and in every case below pmnames[MALE] is the LITERAL 3.6.6 name sitting on
# a stat block that is byte-identical apart from the removal of M2_MALE. Only the
# config key (pmnames[NEUTRAL]) changed. Precedent: "a pure RENAME is not missing
# art at all: redirect to the existing entry."

monster.PM_KOBOLD_LEADER            = "tiles/monster.pm_kobold_lord.png"        -32   -54
statue.PM_KOBOLD_LEADER             = "tiles/statue.pm_kobold_lord.png"         -32   -54
figurine.PM_KOBOLD_LEADER           = "tiles/figurine.pm_kobold_lord.png"       -16   -27

monster.PM_DWARF_LEADER             = "tiles/monster.pm_dwarf_lord.png"         -24   -65
statue.PM_DWARF_LEADER              = "tiles/statue.pm_dwarf_lord.png"          -24   -65
figurine.PM_DWARF_LEADER            = "tiles/figurine.pm_dwarf_lord.png"        -10   -33

monster.PM_DWARF_RULER              = "tiles/monster.pm_dwarf_king.png"         -18   -69
statue.PM_DWARF_RULER               = "tiles/statue.pm_dwarf_king.png"          -18   -69
figurine.PM_DWARF_RULER             = "tiles/figurine.pm_dwarf_king.png"         -7   -35

monster.PM_GNOME_LEADER             = "tiles/monster.pm_gnome_lord.png"         -18   -54
statue.PM_GNOME_LEADER              = "tiles/statue.pm_gnome_lord.png"          -18   -54
figurine.PM_GNOME_LEADER            = "tiles/figurine.pm_gnome_lord.png"         -8   -28

monster.PM_GNOME_RULER              = "tiles/monster.pm_gnome_king.png"         -11   -55
statue.PM_GNOME_RULER               = "tiles/statue.pm_gnome_king.png"          -11   -55
figurine.PM_GNOME_RULER             = "tiles/figurine.pm_gnome_king.png"         -4   -29

monster.PM_OGRE_LEADER              = "tiles/monster.pm_ogre_lord.png"          -29   -95
statue.PM_OGRE_LEADER               = "tiles/statue.pm_ogre_lord.png"           -29   -95
figurine.PM_OGRE_LEADER             = "tiles/figurine.pm_ogre_lord.png"         -14   -49

monster.PM_OGRE_TYRANT              = "tiles/monster.pm_ogre_king.png"          -21   -96
statue.PM_OGRE_TYRANT               = "tiles/statue.pm_ogre_king.png"           -21   -96
figurine.PM_OGRE_TYRANT             = "tiles/figurine.pm_ogre_king.png"         -10   -48

# Vampire leader: monster art exists, statue/figurine art DOES NOT --
# statue.pm_vampire_lord.png and figurine.pm_vampire_lord.png are absent from the
# tile set, and 3.6.6 conf lines 2637/3230 were themselves redirects to PM_VAMPIRE.
# Point the two at PM_VAMPIRE, which IS a live 5.0.0 slot with a direct '='
# definition (conf 2636 / 3229). Chaining via PM_VAMPIRE_LORD would be dead twice
# over: not a 5.0.0 slot (dst == -1) and, even if it were, a second hop.
monster.PM_VAMPIRE_LEADER           = "tiles/monster.pm_vampire_lord.png"       -39   -83
statue.PM_VAMPIRE_LEADER           => statue.PM_VAMPIRE
figurine.PM_VAMPIRE_LEADER         => figurine.PM_VAMPIRE

monster.PM_ELF_NOBLE                = "tiles/monster.pm_elf_lord.png"           -16   -84
statue.PM_ELF_NOBLE                 = "tiles/statue.pm_elf_lord.png"            -16   -84
figurine.PM_ELF_NOBLE               = "tiles/figurine.pm_elf_lord.png"           -8   -42

# Elvenking: the statue hotspot legitimately differs from the monster hotspot
# (-21 -80 vs -22 -78). Copied per range, not per monster.
monster.PM_ELVEN_MONARCH            = "tiles/monster.pm_elvenking.png"          -22   -78
statue.PM_ELVEN_MONARCH             = "tiles/statue.pm_elvenking.png"           -21   -80
figurine.PM_ELVEN_MONARCH           = "tiles/figurine.pm_elvenking.png"         -11   -39

# Aligned cleric: 5.0.0's pmnames[MALE] here is the bare string "priest", which
# collides with the ROLE monster PM_CLERIC below. They are different creatures --
# lvl 12 vs 10, MR 50 vs 2, MS_PRIEST vs MS_HUMANOID, 4d10+kick+AD_CLRC vs 1d6,
# diff 15 vs 12, CLR_WHITE vs HI_DOMESTIC. Bind to aligned_priest art only.
# NOTE: the monster.* line is belt-and-braces. vulture_monster_to_tile()
# (vulture_tile.cpp:627) intercepts mon_id == PM_ALIGNED_PRIEST -- aliased to
# PM_ALIGNED_CLERIC by win/vulture/vulture_nh5compat.h:11 -- and returns
# V_MISC_{LAWFUL,CHAOTIC,NEUTRAL,UNALIGNED}_PRIEST (conf 1320-1323) instead, so
# aligned clerics already render correctly ON THE MAP today. Only the statue and
# figurine ranges were genuinely broken.
monster.PM_ALIGNED_CLERIC           = "tiles/monster.pm_aligned_priest.png"     -18   -82
statue.PM_ALIGNED_CLERIC            = "tiles/statue.pm_aligned_priest.png"      -18   -82
figurine.PM_ALIGNED_CLERIC          = "tiles/figurine.pm_aligned_priest.png"     -9   -41

monster.PM_HIGH_CLERIC              = "tiles/monster.pm_high_priest.png"        -51  -101
statue.PM_HIGH_CLERIC               = "tiles/statue.pm_high_priest.png"         -51  -101
figurine.PM_HIGH_CLERIC             = "tiles/figurine.pm_high_priest.png"       -25   -53


# ---- 2. Gender merges where gender has NO mechanical consequence ----
# 5.0.0 collapsed two gendered role monsters into one. Which of the two sprites
# is "the" art is decided by SLOT RETENTION, the only mechanical tiebreaker:
#   5.0.0 332 BARBARIAN / 333 CAVE_DWELLER / 334 HEALER
#   3.6.6 329 BARBARIAN / 330 CAVEMAN      / 331 CAVEWOMAN / 332 HEALER
#   5.0.0 336 MONK / 337 CLERIC  / 338 RANGER
#   3.6.6 334 MONK / 335 PRIEST  / 336 PRIESTESS / 337 RANGER
# -- the CAVEMAN and PRIEST slots survived; CAVEWOMAN and PRIESTESS were deleted.
# (Same answer as pmnames[MALE].) 3.6.6's two stat blocks are identical to each
# other except for the M2_MALE/M2_FEMALE bit, so neither is the "more correct"
# creature and NOTHING mechanical rides on which sprite is shown. Vulture is
# gender-blind here by construction -- vulture_monster_to_tile() takes only
# mon_id -- exactly as a 3.6.6 "dwarf lady" already drew the dwarf-lord sprite.
# Contrast PM_AMOROUS_DEMON below, where gender IS mechanical.

monster.PM_CAVE_DWELLER             = "tiles/monster.pm_caveman.png"            -16   -88
statue.PM_CAVE_DWELLER              = "tiles/statue.pm_caveman.png"             -16   -88
figurine.PM_CAVE_DWELLER            = "tiles/figurine.pm_caveman.png"            -8   -44

# 5.0.0 adds ATTK(AT_MAGC, AD_CLRC, 0, 0) to this entry; every other field --
# level, speed, AC, MR, align, weight, nutrition, sound, size, all three flag
# words, difficulty, colour -- is unchanged from 3.6.6's "priest".
monster.PM_CLERIC                   = "tiles/monster.pm_priest.png"             -28   -74
statue.PM_CLERIC                    = "tiles/statue.pm_priest.png"              -28   -74
figurine.PM_CLERIC                  = "tiles/figurine.pm_priest.png"            -14   -37


# ---- 3. Collateral: PM_HEALER, broken today and invisible to the textual audit ----
# PM_HEALER is a live 5.0.0 slot (index 334) but conf 2196/2789/3371 redirect it
# to PM_PRIEST, which 5.0.0 removed -- dst == -1, redirect discarded, healer draws
# magenta in all three ranges RIGHT NOW. This is the 32nd failure, not part of the
# 31. Repoint at PM_CLERIC, bound directly just above (one hop, terminal is '=').
monster.PM_HEALER                  => monster.PM_CLERIC
statue.PM_HEALER                   => statue.PM_CLERIC
figurine.PM_HEALER                 => figurine.PM_CLERIC


# ---- 4. Inherited upstream statue/figurine art gaps (NOT a port regression) ----
# Verified: resolving stock upstream Vulture's own config (vulture-baseline
# git c7d1cd3, before this project touched it) against nh366_names.tsv yields
# EXACTLY these same 14 monsters unbound in statue/figurine -- same names, same
# 10-plus-4 split. Upstream's art is 3.4.3-era and these renders were never drawn.
# What THIS port changed is only the FALLBACK: stock had
#   statue.default   => object.STATUE      (conf 2267, still present, now dead)
#   figurine.default => object.FIGURINE    (conf 2860, still present, now dead)
# and Path B appended statue.default => statue.ERROR / figurine.default =>
# figurine.ERROR at the end of the file. deftiles[] is one last-wins slot
# (vulture_tileconfig.cpp:336), so all 14 went from "generic stone statue" to
# "magenta X". Do NOT fix that by reverting the defaults: that would also swallow
# every rename failure above and all future 5.0.0 drift behind plausible art.
# Fix per monster; keep the ERROR default as the tripwire.
#
# object.statue.png (39x64) and object.figurine.png (21x37) were inspected pixel
# by pixel: both are unmistakably HUMANOID -- head, two arms, two legs, plinth.
# That makes the generic fallback a POSITIVE CLAIM about body plan, true for some
# of the 14 and false for the rest. Hence the split below.
# The monster.* range is already correctly bound for all 14 and is deliberately
# not re-stated here.

# 4a. Werecreatures -- pixel-exact art already ships under a sibling name.
# monster.pm_human_wererat.png, monster.pm_human_werejackal.png and
# monster.pm_human_werewolf.png are BYTE-IDENTICAL (md5 bc5a3959...): Vulture ships
# one @-form sprite under three filenames, and monsters.h:2609/2618/2627 give all
# three identical M1/M2 flags, size and attack. statue.pm_human_werejackal.png is
# that same figure in stone, at 37x87 -- matching every other human statue. This is
# not an approximation; it is the art a dedicated wererat statue would have held.
# (object.STATUE would also be the wrong SCALE: 39x64 at -12/-57.)
statue.PM_HUMAN_WERERAT            => statue.PM_HUMAN_WEREJACKAL
figurine.PM_HUMAN_WERERAT          => figurine.PM_HUMAN_WEREJACKAL
statue.PM_HUMAN_WEREWOLF           => statue.PM_HUMAN_WEREJACKAL
figurine.PM_HUMAN_WEREWOLF         => figurine.PM_HUMAN_WEREJACKAL

# 4b. Humanoids -- the generic humanoid statue asserts only "a humanoid statue",
# which is TRUE. It under-specifies WHICH humanoid exactly the way vanilla's `'`
# glyph does, and exactly the way the 185 statue / 176 figurine aliases upstream
# already ships (e.g. statue.PM_GIANT_TICK => statue.PM_SOLDIER_ANT, conf 2269).
# Correct-but-generic, not plausible-but-incorrect. Tiles inspected: aleax = hooded
# robed biped; angel and archon = winged bipeds (the fallback drops the wings --
# under-specification, not a false claim).
statue.PM_ALEAX                    => object.STATUE
figurine.PM_ALEAX                  => object.FIGURINE
statue.PM_ANGEL                    => object.STATUE
figurine.PM_ANGEL                  => object.FIGURINE
statue.PM_ARCHON                   => object.STATUE
figurine.PM_ARCHON                 => object.FIGURINE

# 4c. Golems -- figurine gap only; their statues are already bound (conf 2675-2678).
# All four monster tiles are bipedal two-armed constructs, so the humanoid figurine
# is truthful. Deliberately NOT using a sibling golem figurine (seven ship:
# flesh/wood/gold/leather/rope/straw/paper, ~19x45): for a golem the MATERIAL is
# the identity, so figurine.pm_wood_golem would assert wood the same way BLUE
# asserted an unestablished colour in the generic-gem precedent. The material-
# neutral stone figurine asserts nothing.
figurine.PM_CLAY_GOLEM             => object.FIGURINE
figurine.PM_STONE_GOLEM            => object.FIGURINE
figurine.PM_GLASS_GOLEM            => object.FIGURINE
figurine.PM_IRON_GOLEM             => object.FIGURINE

# 4d. Non-humanoids -- the generic statue would be a LIE about body plan, and
# Vulture's 406 direct statue tiles have taught the player that statue art is a
# reliable identity channel. Tiles inspected: xorn = squat wide rock blob, wider
# than tall; ki-rin = winged unicorn quadruped; zruty = tusked quadruped; lurker
# above and trapper = ceiling/floor mantles with dangling tendrils, no limbs, no
# head. Drawing any of these as a humanoid statue tells the player a HUMANOID was
# petrified on that square -- actionable in statue traps, statue-breaking and
# Sokoban. Same failure mode as the lava-wall precedent. Bound EXPLICITLY to ERROR
# rather than left to fall through the default, so the audit can tell "triaged, art
# genuinely unavailable" from "not yet looked at".
# (NB zruty carries M1_HUMANOID in the core -- monsters.h:1200 -- so this verdict
#  rests on Vulture's OWN art, which is an unambiguous quadruped, not on the flag.
#  The other four are M1_HUMANOID=False and are backed by both.)
statue.PM_XORN                     => statue.ERROR
figurine.PM_XORN                   => figurine.ERROR
statue.PM_KI_RIN                   => statue.ERROR
figurine.PM_KI_RIN                 => figurine.ERROR
statue.PM_ZRUTY                    => statue.ERROR
figurine.PM_ZRUTY                  => figurine.ERROR
statue.PM_LURKER_ABOVE             => statue.ERROR
figurine.PM_LURKER_ABOVE           => figurine.ERROR
statue.PM_TRAPPER                  => statue.ERROR
figurine.PM_TRAPPER                => figurine.ERROR


# ---- 5. Displacer beast: a live rule violation the mechanical audit cannot see ----
# New in 5.0.0 (absent from nh366_names.tsv). Conf 1726/2341/2934 redirect it to
# PM_LARGE_CAT -- inherited byte-identically from the 3.6.6 baseline, where it was
# DEAD config because no such monster existed. In 5.0.0 it goes live and resolves
# SUCCESSFULLY, so it never appears in a "fails to resolve" audit. No displacer
# beast art exists anywhere in either tree.
# What it draws: monster.pm_large_cat.png, an ordinary grey domestic housecat.
# What it is: monsters.h:437 -- difficulty 14, LVL(12,12,-10,0,-3), 4d4/4d4/2d10,
# SIZ(750,400,MS_GROWL,MZ_LARGE), M2_HOSTILE|M2_NASTY, M3_DISPLACES, CLR_BLUE.
# Large cat (monsters.h:421) is difficulty 7, one 2d4 bite, MZ_SMALL, M2_DOMESTIC,
# MS_MEW, HI_DOMESTIC -- literally the player's grown-up pet kitten. Worse, this
# port's isometric map draws no pet marker at all (MAP_PET is consumed only by
# winclass/minimap.cpp and winclass/levelwin.cpp, never by winclass/map.cpp), so
# the mis-render is pixel-identical to the player's own pet with nothing to
# disambiguate it. Textbook "plausible-but-incorrect game art", and lethal.
# These three lines override the earlier redirects by last-wins; delete conf
# 1726/2341/2934 in a cleanup pass.
monster.PM_DISPLACER_BEAST         => monster.ERROR
statue.PM_DISPLACER_BEAST          => statue.ERROR
figurine.PM_DISPLACER_BEAST        => figurine.ERROR


# ---- 6. Gold dragons: no art exists, and no honest donor exists either ----
# Genuinely new in 5.0.0. `find -iname "*gold*dragon*"` over all three trees returns
# nothing; the shipped dragon art covers gray/silver/red/white/orange/black/blue/
# green/yellow (+ monster-only shimmering, whose monster no longer exists).
# Red was the strongest candidate -- gold and red are the only two AD_FIRE breathers
# -- and is REJECTED: breath 4d6 vs 6d6, align +4 (lawful) vs -4 (chaotic), corpse
# conveys NOTHING vs MR_FIRE, and decisively mondata.h:178-185 hardcodes both gold
# dragons into emits_light(). They are the ONLY light-emitting dragons in the game,
# and this port DOES render light level (vulture_tile.cpp:40, shade_scale[3] =
# {256,175,79}), so the player would see a self-lit bubble containing a "red
# dragon" -- a phenomenon no red dragon produces.
# Yellow was checked too, because include/color.h:46 defines HI_GOLD as CLR_YELLOW
# -- gold and yellow dragons share a colour VALUE, so tty cannot tell them apart.
# Also REJECTED: yellow breathes AD_ACID and conveys MR_ACID|MR_STONE. Dragon
# colour-to-breath is the single most safety-critical visual mapping in the game.
# The honest statement is therefore not "red asserts a colour the game did not
# establish" but "the colour the game DID establish is already occupied by a live
# species, so no colour-faithful donor can exist". Placeholder is correct, not a
# compromise. TODO(art): 6 tiles, metallic gold, ideally with a visible glow.
monster.PM_GOLD_DRAGON             => monster.ERROR
statue.PM_GOLD_DRAGON              => statue.ERROR
figurine.PM_GOLD_DRAGON            => figurine.ERROR
# Baby: no breath attack at all, so not even the shared-fire argument applies. Its
# only distinguishing traits versus its siblings ARE its colour and its light
# emission (mondata.h:181 lists PM_BABY_GOLD_DRAGON explicitly); baby red resists
# MR_FIRE where baby gold's resistance field is 0.
monster.PM_BABY_GOLD_DRAGON        => monster.ERROR
statue.PM_BABY_GOLD_DRAGON         => statue.ERROR
figurine.PM_BABY_GOLD_DRAGON       => figurine.ERROR


# ---- 7. Amorous demon: the one merge where gender IS mechanical ----
# 5.0.0 merged succubus + incubus (monsters.h:2934 says so outright). Slot
# arithmetic keeps the SUCCUBUS slot -- 5.0.0 289/290/291 WATER_DEMON /
# AMOROUS_DEMON / HORNED_DEVIL mirrors 3.6.6 285/286/287 WATER_DEMON / SUCCUBUS /
# HORNED_DEVIL, and the post-horned-devil INCUBUS slot vanished -- so by the same
# rule used for CAVE_DWELLER and CLERIC above the answer would be succubus art.
# IT IS REFUSED HERE, because unlike those two merges gender is not cosmetic:
#   src/mhitu.c:1980  return (genagr == 1 - gendef) ? 1 : (pagr->mlet == S_NYMPH) ? 2 : 0;
# a foocubus can ONLY seduce a hero of the OPPOSITE gender, so its signature attack
# does not fire at all against a same-gender player; doseduce() (mhitu.c:1988) then
# branches its entire script on `Mgender(mon) == FEMALE`. And the two shipped tiles
# are strongly, unmistakably gendered (inspected: incubus = muscular male demon,
# succubus = nude female demon), while 5.0.0 still PRINTS the gendered name via
# mon_pmname()/pmname(mon->data, Mgender(mon)). A static sprite would therefore
# contradict both the message window and a live combat mechanic roughly half the
# time. That is the LAVA-WALL precedent -- "left as a placeholder rather than drawn
# as lava floor, because that would imply it is walkable" -- not the harmless
# "dwarf lady shows the dwarf-lord sprite" case.
# This is NOT permanent art debt: all six incubus/succubus PNGs already ship, and
# vulture_monster_to_tile() already does per-instance dispatch nine lines above the
# generic return (vulture_tile.cpp:627 reads m_at(x,y)->EPRI()->shralign for
# aligned priests -- the x,y parameters exist for exactly this). Statues and
# figurines carry gender in obj->spe & CORPSTAT_GENDER already.
# TODO(code): dispatch PM_AMOROUS_DEMON on Mgender() to the two existing tiles,
# then replace these six lines with real bindings. Until then, conspicuous.
monster.PM_AMOROUS_DEMON           => monster.ERROR
statue.PM_AMOROUS_DEMON            => statue.ERROR
figurine.PM_AMOROUS_DEMON          => figurine.ERROR

# ---- end monster-range repair ----
