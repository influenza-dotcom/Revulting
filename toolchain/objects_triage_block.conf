# ---- Triaged object placeholders: art genuinely unavailable, bound EXPLICITLY ----
# to ERROR so the audit can tell "triaged, no honest art exists" from "not yet
# looked at" (same convention as the monster-range repair).  Rationale for each
# is in the generic-objects block above / the port log: gold dragon gear would
# mislead about resistance type; globs drawn with monster art would assert a
# LIVE hostile on the square; SPE_NOVEL's tile would collide with the shuffled
# spellbook pool.  None of these is appearance-shuffled, so each placeholder is
# contained to its own slot.
object.GOLD_DRAGON_SCALE_MAIL      => object.ERROR
objicon.GOLD_DRAGON_SCALE_MAIL     => objicon.ERROR
object.GOLD_DRAGON_SCALES          => object.ERROR
objicon.GOLD_DRAGON_SCALES         => objicon.ERROR
object.GLOB_OF_GRAY_OOZE           => object.ERROR
objicon.GLOB_OF_GRAY_OOZE          => objicon.ERROR
object.GLOB_OF_BROWN_PUDDING       => object.ERROR
objicon.GLOB_OF_BROWN_PUDDING      => objicon.ERROR
object.GLOB_OF_GREEN_SLIME         => object.ERROR
objicon.GLOB_OF_GREEN_SLIME        => objicon.ERROR
object.GLOB_OF_BLACK_PUDDING       => object.ERROR
objicon.GLOB_OF_BLACK_PUDDING      => objicon.ERROR
object.SPE_NOVEL                   => object.ERROR
objicon.SPE_NOVEL                  => objicon.ERROR
