# ---- NetHack 5.0.0 monster renames (degendered / de-archaised titles) ----
# 5.0.0 renamed a family of monsters to drop gendered and archaic titles. The
# creatures are unchanged; only the name Vulture keys its art on changed, so
# every one of these fell through to monster.default => monster.ERROR and drew
# the conspicuous magenta placeholder. Reported live by a player as "kobold lord
# is a placeholder magenta box" and again for gnome lord.
#
# This is a pure RENAME, not missing art: Vulture ships monster, statue AND
# figurine art for every source name below. Restoring the binding restores the
# exact 3.6.6 rendering.
#
# ONE-HOP RULE: vulture_resolve_tile_id() (win/vulture/vulture_tile.cpp) applies
#   if (... gametiles[tile_id].ptr != -1) tile_id = gametiles[tile_id].ptr;
# -- an `if`, not a `while`. Only ONE redirect is followed, so every target here
# must be a DIRECT '=' definition. PM_VAMPIRE_LORD's statue/figurine entries are
# themselves redirects to PM_VAMPIRE, so the vampire lines below point at
# PM_VAMPIRE directly rather than chaining through PM_VAMPIRE_LORD.
#
# Merged pairs (priest/priestess -> cleric, caveman/cavewoman -> cave dweller,
# incubus/succubus -> amorous demon) and genuinely new monsters (gold dragons)
# are NOT here -- they need a judgement call about which source art is honest,
# and are handled separately.

monster.PM_KOBOLD_LEADER           => monster.PM_KOBOLD_LORD
statue.PM_KOBOLD_LEADER            => statue.PM_KOBOLD_LORD
figurine.PM_KOBOLD_LEADER          => figurine.PM_KOBOLD_LORD

monster.PM_DWARF_LEADER            => monster.PM_DWARF_LORD
statue.PM_DWARF_LEADER             => statue.PM_DWARF_LORD
figurine.PM_DWARF_LEADER           => figurine.PM_DWARF_LORD

monster.PM_DWARF_RULER             => monster.PM_DWARF_KING
statue.PM_DWARF_RULER              => statue.PM_DWARF_KING
figurine.PM_DWARF_RULER            => figurine.PM_DWARF_KING

monster.PM_GNOME_LEADER            => monster.PM_GNOME_LORD
statue.PM_GNOME_LEADER             => statue.PM_GNOME_LORD
figurine.PM_GNOME_LEADER           => figurine.PM_GNOME_LORD

monster.PM_GNOME_RULER             => monster.PM_GNOME_KING
statue.PM_GNOME_RULER              => statue.PM_GNOME_KING
figurine.PM_GNOME_RULER            => figurine.PM_GNOME_KING

monster.PM_OGRE_LEADER             => monster.PM_OGRE_LORD
statue.PM_OGRE_LEADER              => statue.PM_OGRE_LORD
figurine.PM_OGRE_LEADER            => figurine.PM_OGRE_LORD

monster.PM_OGRE_TYRANT             => monster.PM_OGRE_KING
statue.PM_OGRE_TYRANT              => statue.PM_OGRE_KING
figurine.PM_OGRE_TYRANT            => figurine.PM_OGRE_KING

# statue/figurine skip PM_VAMPIRE_LORD: those entries are redirects themselves
monster.PM_VAMPIRE_LEADER          => monster.PM_VAMPIRE_LORD
statue.PM_VAMPIRE_LEADER           => statue.PM_VAMPIRE
figurine.PM_VAMPIRE_LEADER         => figurine.PM_VAMPIRE

monster.PM_ELF_NOBLE               => monster.PM_ELF_LORD
statue.PM_ELF_NOBLE                => statue.PM_ELF_LORD
figurine.PM_ELF_NOBLE              => figurine.PM_ELF_LORD

monster.PM_ELVEN_MONARCH           => monster.PM_ELVENKING
statue.PM_ELVEN_MONARCH            => statue.PM_ELVENKING
figurine.PM_ELVEN_MONARCH          => figurine.PM_ELVENKING
