# ---- NetHack 5.0.0 object slots that had no binding of their own ----
# 16 object types exist in 5.0.0 with no entry in EITHER the object.* or the
# objicon.* range, so all 16 fall through to object.default => object.ERROR
# below. 9 are bound here; the other 7 are deliberately LEFT on the conspicuous
# placeholder and are listed at the end of this comment.
#
# WHY MOST OF THESE ARE CORRECTNESS, NOT POLISH: vulture_resolve_tile_id()
# (win/vulture/vulture_tile.cpp) substitutes objects[otyp].oc_descr_idx BEFORE
# looking the tile up, so in an appearance-shuffled class an unbound slot does
# not merely break itself. shuffle() (src/o_init.c) is a permutation, so every
# game some OTHER type receives the unbound index and then draws the magenta X
# even when its own art is present -- this is what made an IDENTIFIED "spellbook
# of force bolt" render as a placeholder. Ranges re-derived from
# obj_shuffle_range() and win/vulture/pathb/nh500_names.tsv:
#   helms     97..100  (HELMET..HELM_OF_TELEPATHY)                -> 98 inside
#   amulets  201..211  (walk stops at FAKE_AMULET_OF_YENDOR, mgc=0) -> 210 inside
#   books    366..406  (walk stops at SPE_BLANK_PAPER, mgc=0)     -> 406 is LAST
#   wands    410..437  (entire class, no early-out)               -> 415 inside
#   venom    479..480  (entire class)                             -> both inside
#
# CONSTRAINT: vulture_resolve_tile_id() follows exactly ONE config redirect
# ("tile_id = vulture_gametiles[tile_id].ptr" -- not a loop), so every target
# below is a DIRECT '=' definition, never another '=>' key.

# Helms: HELM_OF_CAUTION is new in 5.0.0 and sits inside the shuffled helm range
# with HELMET, HELM_OF_OPPOSITE_ALIGNMENT and HELM_OF_TELEPATHY, all three of
# which already redirect to object.HELMET (lines 170-172 / 798-800), as do the
# three racial helms (162-164 / 790-792). Seven helms already share this one
# tile, so an eighth asserts nothing new -- and leaving it unbound would break
# the other three.
object.HELM_OF_CAUTION             => object.HELMET
objicon.HELM_OF_CAUTION            => objicon.HELMET

# Shields: 5.0.0 gives both new shields the SAME unidentified description as the
# plain small shield -- include/objects.h:653/656/659 are all kn=0, WOOD/HI_WOOD,
# descr "wooden shield". The core deliberately makes them indistinguishable, so
# shared art is exactly right. Shields are NOT shuffled (obj_shuffle_range()'s
# ARMOR_CLASS arm covers only helms/gloves/cloaks/boots), so an unbound slot
# resolves to itself -- which makes the placeholder actively HARMFUL here: only
# the two MAGIC wooden shields would draw a magenta X, leaking the magic-ness the
# core is concealing. Binding asserts no resistance either way.
object.SHIELD_OF_DRAIN_RESISTANCE  => object.SMALL_SHIELD
objicon.SHIELD_OF_DRAIN_RESISTANCE => objicon.SMALL_SHIELD
object.SHIELD_OF_SHOCK_RESISTANCE  => object.SMALL_SHIELD
objicon.SHIELD_OF_SHOCK_RESISTANCE => objicon.SMALL_SHIELD

# Amulets: AMULET_OF_GUARDING is inside the shuffled amulet range 201..211, so
# leaving it unbound lets ANY unidentified amulet draw the placeholder. Vulture
# ships exactly one amulet tile pair and every other amulet slot already
# redirects to it (lines 241-254 / 869-882) -- including the sibling 3.7-era
# addition AMULET_OF_FLYING. Every amulet already looks identical, so this
# redirect asserts nothing.
object.AMULET_OF_GUARDING          => object.AMULET_OF_ESP
objicon.AMULET_OF_GUARDING         => objicon.AMULET_OF_ESP

# Enormous meatball: NOT new content -- this is 3.6.6's HUGE_CHUNK_OF_MEAT
# renamed (include/objects.h:1058 carries the comment: formerly huge chunk of meat;
# src/objnam.c records the old name). Its OWN art is already shipped but
# orphaned, because conf lines 327/955 still key it under the 3.6.6 name, which
# no longer exists in tilenames[] and is therefore silently dropped by
# vulture_get_tile_index(). For the same reason this MUST be a direct '='
# binding: "=> object.HUGE_CHUNK_OF_MEAT" would resolve dst == -1 and no-op.
# Offsets copied verbatim from lines 327/955 -- same artwork, same size.
# (Lines 327 and 955 are now dead and should be deleted in a cleanup pass.)
object.ENORMOUS_MEATBALL            = "tiles/object.huge_chunk_of_meat.png"   -33   -86
objicon.ENORMOUS_MEATBALL           = "tiles/objicon.huge_chunk_of_meat.png"     6     1

# Spellbook of chain lightning: ACCEPTED LEAST-BAD TRADEOFF, not a free alias.
# Unlike amulets and wands, every one of the 40 bound members of the 366..406
# shuffle pool currently owns UNIQUE art (verified: 42 direct object.spe_* '='
# definitions, all live 5.0.0 names, zero unreferenced spellbook PNGs on disk),
# so this redirect creates the only tile collision in the pool: the "gray" and
# "checkered" appearances become pixel-identical, and identifying one makes the
# other read as already-identified. That residual harm is accepted because the
# alternative is worse and is NOT the governing rule's protected "missing art
# renders as a conspicuous placeholder" case: slot 406 is the LAST member of the
# pool, so leaving it unbound guarantees that one randomly-chosen spellbook type
# per game -- with correct art present, possibly already identified -- draws the
# magenta X instead. A bounded ambiguity between 2 of 41 appearances beats an
# unbounded placeholder leak onto arbitrary identified books.
# SPE_DETECT_TREASURE is the colour-correct partner: objects.h:1373 and :1409 are
# both CLR_GRAY, and shuffle() (o_init.c:136-138) swaps oc_color in lockstep with
# oc_descr_idx. SPE_BLANK_PAPER was rejected -- it has the fixed description
# "plain", is excluded from the shuffle, and its tile genuinely means "blank
# book" (magic-marker stock), so aliasing onto it WOULD assert a false identity.
# TODO(art): draw object.spe_chain_lightning.png / objicon.spe_chain_lightning.png
# and convert these two lines to direct '=' bindings. No rebinding can remove the
# collision -- there is no spare spellbook tile.
object.SPE_CHAIN_LIGHTNING         => object.SPE_DETECT_TREASURE
objicon.SPE_CHAIN_LIGHTNING        => objicon.SPE_DETECT_TREASURE

# Wand of stasis: new 5.0.0 appearance ("redwood"). WAND_CLASS shuffles as an
# ENTIRE class with no early-out, so this is the widest exposure of the four --
# an unbound slot can make any wand, identified or not, draw the placeholder.
# One wand tile pair exists and 54 wand slots already redirect to it (530-583 /
# 1158-1211), so no wand tile carries identifying information today.
object.WAN_STASIS                  => object.WAN_LIGHT
objicon.WAN_STASIS                 => objicon.WAN_LIGHT

# Venom: pure RENAME, not missing art. 3.6.6's BLINDING_VENOM/ACID_VENOM became
# 5.0.0's SPLASH_OF_* (include/objects.h:1637/1640 -- note the C otyp constants
# are still BLINDING_VENOM/ACID_VENOM; the conf key comes from oc_name, so the
# 'SPLASH_OF_' spelling is the one that binds). Vulture has always drawn venom
# splashes with the water-potion sprite; conf lines 627-628/1255-1256 still say
# so under the dead old names and are inert no-ops today. These four lines simply
# restore the 3.6.6 rendering. Target POT_WATER directly: pointing at the old
# alias would be dropped (dst == -1) and leave the placeholder.
object.SPLASH_OF_BLINDING_VENOM    => object.POT_WATER
objicon.SPLASH_OF_BLINDING_VENOM   => objicon.POT_WATER
object.SPLASH_OF_ACID_VENOM        => object.POT_WATER
objicon.SPLASH_OF_ACID_VENOM       => objicon.POT_WATER

# DELIBERATELY LEFT ON object.default => object.ERROR (7 slots).
# None of these is appearance-shuffled, so each placeholder is contained to its
# own slot and cannot make any other object render wrongly:
#   102 GOLD_DRAGON_SCALE_MAIL, 112 GOLD_DRAGON_SCALES -- for dragon armour the
#     COLOUR IS the gameplay identity. gold is (HI_GOLD, no resistance); the only
#     visually adjacent tile is yellow, which is (CLR_YELLOW, ACID_RES). Drawing
#     gold as yellow would assert a resistance the item does not grant, and for
#     the scales would also misstate what the crafted mail will confer. No gold
#     dragon art of any kind exists in the 2399-file set. DRGN_ARMR is NoDes with
#     kn=1 and DSM lies outside every obj_shuffle_range() window, so no contagion.
#   271-274 GLOB_OF_GRAY_OOZE / BROWN_PUDDING / GREEN_SLIME / BLACK_PUDDING --
#     NOT renames (identical names in 3.6.6) and never bound in the 3.6.6 conf
#     either; no object.glob_*.png exists anywhere. FOOD_CLASS is absent from
#     shuffle_classes[], so nothing is at risk. Every substitute is forbidden:
#     meatball/slime_mold assert safe ordinary food (the green-slime glob is the
#     game's signature lethal food -- that substitution could kill a player), and
#     monster.pm_*_pudding.png is creature art that would read as a live monster.
#   408 SPE_NOVEL -- outside every shuffle range (oc_magic=0 and it sits after
#     SPE_BLANK_PAPER, so obj_shuffle_range() collapses it to itself); its
#     oc_descr_idx stays 408 forever and it can never leak onto another item. It
#     is a spellbook only for inventory-letter purposes (objnam.c never calls it
#     a spellbook; read.c and write.c exclude it). No novel/paperback art exists,
#     and every candidate asserts a false identity: SPE_BLANK_PAPER would claim
#     usable magic-marker stock, any shuffled book would claim a real spell.
# All 7 are ART REQUESTS, not config bugs; the conspicuous placeholder is the
# outcome the governing rule explicitly sanctions.
